<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RAY Peli 3">
<meta name="theme-color" content="#111111">
<title>RAY Peli 3 – Tuplapotti</title>
<style>
html,body{margin:0;padding:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px;text-align:center;background:#1b1b1b}
h1{font-size:18px;margin:0 0 4px}
p{font-size:12px;margin:0;color:#bbb}
#game{flex:1;display:flex;justify-content:center;align-items:center;padding:10px;box-sizing:border-box}
ruffle-player{width:min(100vw,900px);height:min(80vh,700px);max-height:calc(100vh - 95px)}
.note{font-size:12px;color:#aaa;text-align:center;padding:8px 12px 14px}
</style>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
<header>
<h1>RAY Peli 3 – Tuplapotti</h1>
<p>Vanha RAY-peli • Ruffle</p>
</header>
<main id="game"></main>
<div class="note">Peli latautuu hetken kuluttua.</div>
<script>
window.addEventListener("DOMContentLoaded", async () => {
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  player.style.width = "100%";
  player.style.height = "100%";
  document.getElementById("game").appendChild(player);
  await player.ruffle().load("ray-peli-3.swf");
});
</script>
</body>
</html>
